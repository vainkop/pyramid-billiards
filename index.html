<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Пирамида — школа и игра</title>
  <meta name="description" content="Русский бильярд: уроки техники удара (накат, оттяжка, винт, свояк, массе), упражнения, партия в «американку» и «сибирку», колхоз втроём и больше и таблица расчёта для колхоза.">
  <meta name="theme-color" content="#0c1310">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Пирамида">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Telegram Mini App: Telegram's script only when opened from Telegram — it opens the page with
    // tgWebApp… parameters in the hash and keeps them in sessionStorage across reloads.
    // Elsewhere (the plain web, the Android app, offline) nothing extra is loaded.
    (function () {
      var inTelegram = /tgWebApp/.test(location.hash);
      try { inTelegram = inTelegram || Boolean(sessionStorage.getItem('__telegram__initParams')); } catch (e) {}
      if (inTelegram) document.write('<script src="https://telegram.org/js/telegram-web-app.js"><\/script>');
    })();
  </script>
  <script type="module" src="src/app.js"></script>
</head>
<body>
  <main id="view" class="view"></main>
  <nav id="nav" class="nav" aria-label="Разделы"></nav>
  <noscript>Для работы приложения нужен JavaScript.</noscript>
</body>
</html>
